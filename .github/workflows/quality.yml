name: Quality checks

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-fusion-video-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ai-fusion-video-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ai-fusion-video-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: '123456'
          MYSQL_DATABASE: ai_fusion_video
        ports:
          - 43306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p123456"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 46379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATA_REDIS_PASSWORD: ''
      VIDEO_COMPOSE_FFMPEG_PATH: ffmpeg
      VIDEO_COMPOSE_FFPROBE_PATH: ffprobe
    defaults:
      run:
        working-directory: ai-fusion-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ai-fusion-video/pom.xml
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run unit and Agent persistence integration tests
        run: |
          chmod +x mvnw
          ./mvnw -B -Pagentscope-integration verify
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ai-fusion-video/target/*.jar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            ai-fusion-video/target/surefire-reports/
            ai-fusion-video/target/failsafe-reports/
          retention-days: 7
